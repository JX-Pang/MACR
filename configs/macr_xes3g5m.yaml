paths:
  project_root: ".."
  dataset: "XES3G5M"
  fold: "fold1"
  model_id: "meta-llama/Llama-3.2-3B-Instruct"
  output_root: "runs"
  generated_root: "generated"

train:
  batch_size: 2
  epochs: 5
  learning_rate: 5e-5
  max_length: 512
  lambda_meas: 0.5
  lambda_beh: 1.0
  tau_meas: 0.1
  tau_beh: 0.1
  align_weight: 0.5
  seed: 42
  interaction_type: "ncd"
  use_prednet: true

lora:
  r: 8
  alpha: 32
  dropout: 0.1
  target_modules: ["q_proj", "k_proj", "v_proj", "o_proj"]

inference:
  parallel_forms: 3
  reliability_tau: 0.1
  form_names: ["heuristic", "logic_distillation", "isomorphic"]
